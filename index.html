<style>
:root{--blue:#0091CC;--black:#1D1D1B;--dark:#3F3C3B;--mid:#A2A5AB;--light:#ECEBEC;--navy:#005187}
html,body{height:100%;margin:0}
body{background:#fff;color:var(--dark);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}

button{border:0;background:var(--blue);color:#fff;font:inherit;font-weight:700;font-size:14px;padding:11px;cursor:pointer}
button:hover{background:var(--navy)}
button:disabled{opacity:.6;cursor:wait}
.err{color:#B3261E;font-size:12.5px;min-height:1em}
.dot{width:12px;height:12px;border-radius:50%;background:var(--blue);align-self:flex-end}
</style></head>
