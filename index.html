<title>Haiti School Sites</title>
<style>
:root{--blue:#0091CC;--black:#1D1D1B;--dark:#3F3C3B;--mid:#A2A5AB;--light:#ECEBEC;--navy:#005187}
html,body{height:100%;margin:0}
body{background:#fff;color:var(--dark);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.accent{width:44px;height:6px;background:var(--blue)}
h1{margin:0;font-size:26px;line-height:1.1;color:var(--black);font-weight:800}
p{margin:0;font-size:13.5px;color:#6E6F73}
label{font-size:12px;color:#6E6F73}
input{width:100%;box-sizing:border-box;border:1px solid var(--mid);padding:10px 12px;font:inherit;font-size:15px;border-radius:0}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
button{border:0;background:var(--blue);color:#fff;font:inherit;font-weight:700;font-size:14px;padding:11px;cursor:pointer}
button:hover{background:var(--navy)}
button:disabled{opacity:.6;cursor:wait}
.err{color:#B3261E;font-size:12.5px;min-height:1em}
.dot{width:12px;height:12px;border-radius:50%;background:var(--blue);align-self:flex-end}
</style></head>
